<html lang="en">
<head>

<title>__TITLE__</title>
<style>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const KEY = "superWADERs:" + D.report_id;

// ---------------------------------------------------------------- data arrays (gzip + base64)
async function arr(a) {

  const bin = Uint8Array.from(atob(a.b64), c => c.charCodeAt(0));
  const buf = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();

const COLORS = ["#2a6fdb", "#e0832b", "#2a9d6f", "#b04fc8", "#c0392b", "#7f8c8d"];

// ---------------------------------------------------------------- interactive line plot

    const btn = (lab, tip, f) => { const b = document.createElement("button"); b.textContent = lab; b.title = tip; b.onclick = f; pb.appendChild(b); };

    btn(this.o.logy ? "lin y" : "log y", "switch the y axis between linear and logarithmic", e => { this.o.logy = !this.o.logy; e.target.textContent = this.o.logy ? "lin y" : "log y"; this.home = this._extent(); this.view = Object.assign({}, this.home); this.draw(); });

    const h = document.createElement("div"); h.className = "help";
    h.textContent = "drag: zoom box · shift+drag: pan · wheel: zoom x (alt: y) · double-click: reset"; box.appendChild(h);
    this.series = []; this.masks = []; this.box = box; this.view = null;

  }
  set(series, masks) { this.series = series || []; this.masks = masks || []; this.home = this._extent(); this.view = Object.assign({}, this.home); this.draw(); }
  _tx(v, log) { return log ? Math.log10(v) : v; }
  _extent() {

    for (const s of this.series) {

  }
  _pad(v) {

    if (ly) return { x0: v.x0, x1: v.x1, y0: v.y0 / 1.5, y1: v.y1 * 1.5 };

  }
  _yfit() {      // y range of the visible x range

  }
  _range(s) {     // indices of the points inside the x view (x sorted)
    const n = s.y.length, v = this.view;

    for (const t of nice(v.y0, v.y1, Math.max(3, ph / 45), ly)) { const y = Y(t); g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.textAlign = "right"; g.fillText(fmt(t), L - 4, y + 4); }

    g.save(); g.translate(12, T + ph / 2); g.rotate(-Math.PI / 2); g.fillText(this.o.ylabel, 0, 0); g.restore();

    if (named.length > 10) { g.fillStyle = css("--muted"); g.fillText(`+ ${named.length - 9} more`, L + pw - 6, ly0 + 8); }

  _inv(px, py) {

async function defectsTab(t, items) {        // defect map, the CCDs as frames

const HELP = `<h2 style="margin-top:0">How to use this report</h2>
<p>One page per module. <b>CCDs</b> (below the tabs): tick the CCDs to show, <b>all CCDs in the module</b> for all of them, <b>only</b> next to a CCD for that one alone. Every tab follows the choice: traces one below the other, PSD and profiles overlaid (one colour per CCD), numbers side by side, images one CCD at a time. A red dot on a tab: one of its numbers is outside the usual range for a ticked CCD; a red dot on a CCD: that CCD has such numbers.</p>
<h3>Plots</h3><p><kbd>drag</kbd> draw a box to zoom in on a range · <kbd>shift</kbd>+<kbd>drag</kbd> move the view · <kbd>wheel</kbd> zoom the x axis (with <kbd>alt</kbd>: the y axis) · <kbd>double-click</kbd> or <b>reset</b>: everything again · <b>log y</b>: switch the y axis · <b>PNG</b>: save the plot. Move the mouse over a plot to read the values.</p>
<h3>Images (like ds9 frames)</h3><p>The slider, <b>&#9664;</b> / <b>&#9654;</b> or the <kbd>&larr;</kbd> <kbd>&rarr;</kbd> keys switch between the ticked CCDs; zoom, pan, scale and the row / column cut stay, so the same spot can be compared. <b>blink</b> switches every second. <kbd>wheel</kbd> or <b>+</b>/<b>&minus;</b> zoom · <kbd>drag</kbd> move · <kbd>click</kbd> a pixel: its row and column are plotted below · <kbd>shift</kbd>+<kbd>drag</kbd> a box: statistics of that region · <b>scale</b>: colour range (auto: around the background level, like ds9 zscale; 99.5 %: ignores the brightest pixels; manual: type min / max) · <b>asinh</b>: brings out faint structure · <b>fit</b> / <b>1:1</b> whole image / one image pixel per screen pixel. Row 0 is at the bottom (as ds9).</p>
<h3>Reviews</h3><p>Every tab ends with a review box: your name, a status (approved / concern / rejected / note), what it is about (the whole module or one CCD) and a comment. The line under the title lists every review of the module, also those written on the overview pages. A new review is kept in this browser until it is saved: <b>Save to campaign folder</b> (Chrome, Edge) writes it into the campaign's <code>reviews/</code> folder; <b>Download</b> (any browser) gives a file to put there, then <code>run_superWADERs --campaign DIR</code>. Saved reviews show on every page of the campaign and in its <code>reviews.csv</code>.</p>
<h3>PDF</h3><p><b>Export PDF</b> opens the print dialog with every tab on its own page (the ticked CCDs) and the comments included: choose "Save as PDF".</p>
<h3>Log</h3><p>Each tab ends with the log of how its numbers were made (per ticked CCD): files, settings from the data header, checks, fit results.</p>`;

(async function () {

      const i = l.querySelector("input"); i.onchange = () => setSel(i.checked ? [...SEL, c.key] : SEL.filter(k => k !== c.key));

    nav.appendChild(bar);

  const want = location.hash.slice(1); (tabs.find(x => x.tb.id === want) || tabs[0]).show();
