# CICERO's Python environment (conda / mamba / micromamba, conda-forge; Linux or macOS: ROOT is not on conda-forge
# for Windows). Make it once:
#     conda env create -f CICERO/environment.yml        (or: mamba env create -f ..., micromamba create -f ...)
# run_CICERO finds an environment named "damic" by itself (or give --env NAME / $CICERO_ENV), so there is no need to
# activate it. Versions: the ones CICERO was checked with (2026-11-24); newer ones are expected to work.
name: damic
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26          # ROOT and numba were checked with numpy 1.26
  - scipy>=1.13
  - astropy>=6.1
  - numba>=0.60
  - scikit-image>=0.24
  - matplotlib>=3.9
  - root>=6.32          # PyROOT (cluster files) and the root command (--composite)
